<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Interactive Budgeting</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>SpendWise</h1>
            <p>Smart Interactive Budgeting</p>
        </header>

        <section class="budget-section">
            <h2>Set Your Budget</h2>
            <div class="input-group">
                <input type="number" id="budgetInput" placeholder="Enter monthly budget (e.g 50000)">
                <button id="setBudgetBtn">Set Budget</button>
            </div>
            <div id="budgetFeedback" class="feedback"></div>
        </section>

        <section class="dashboard">
            <div class="card"><h3>Total Budget</h3><p id="totalBudget">KES 0</p></div>
            <div class="card"><h3>Total Spent</h3><p id="totalSpent">KES 0</p></div>
            <div class="card"><h3>Balance</h3><p id="balance">KES 0</p></div>
        </section>

        <div id="statusMessage" class="status"></div>

        <section class="add-expense">
            <h2>Add Expense</h2>
            <form id="expenseForm">
                <input type="text" id="expenseName" placeholder="Expense name (e.g Rent)" required>
                <input type="number" id="expenseAmount" placeholder="Amount" required>
                <select id="expenseCategory" required>
                    <option value="">Select Category</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Rent">Rent</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                </select>
                <button type="submit">Add Expense</button>
            </form>
        </section>

        <section class="expense-list-section">
            <h2>Expense Records</h2>
            <table id="expenseTable">
                <thead><tr><th>#</th><th>Name</th><th>Category</th><th>Amount</th><th>Action</th></tr></thead>
                <tbody id="expenseList"></tbody>
            </table>
            <button id="clearBtn" class="clear-btn">Clear All</button>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
